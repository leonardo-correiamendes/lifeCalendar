name: release-please

# À chaque push sur main, release-please lit les Conventional Commits (feat:, fix:...)
# et tient à jour une PR de release. La fusionner crée le tag, la release GitHub et le CHANGELOG.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
